name: Crear APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crear-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Localizar y preparar el proyecto
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          proyectos = [
              p for p in Path(".").rglob("project.godot")
              if not {".git", ".godot"}.intersection(p.parts)
          ]

          if len(proyectos) != 1:
              raise SystemExit(
                  "Debe existir un unico project.godot. "
                  f"Encontrados: {[str(p) for p in proyectos]}"
              )

          carpeta = proyectos[0].parent.resolve()

          for nombre in ("export_presets.cfg", "scenes/main.tscn"):
              if not (carpeta / nombre).is_file():
                  raise SystemExit(
                      f"Falta este archivo: {carpeta / nombre}"
                  )

          # Corregir ajustes solo en la copia de compilacion.
          preset = carpeta / "export_presets.cfg"
          texto = preset.read_text(encoding="utf-8")
          texto = re.sub(
              r"(?m)^gradle_build/use_gradle_build\s*=.*$",
              "gradle_build/use_gradle_build=false",
              texto,
          )
          preset.write_text(texto, encoding="utf-8")

          proyecto = carpeta / "project.godot"
          texto = proyecto.read_text(encoding="utf-8")
          texto = re.sub(
              r"(?m)^window/handheld/orientation\s*=.*$",
              "window/handheld/orientation=0",
              texto,
          )
          proyecto.write_text(texto, encoding="utf-8")

          # Ajuste de tipado del generador anterior.
          zombie = carpeta / "scripts/zombie.gd"
          if zombie.is_file():
              texto = zombie.read_text(encoding="utf-8")
              texto = texto.replace(
                  "var ratio := clamp(",
                  "var ratio := clampf(",
              )
              zombie.write_text(texto, encoding="utf-8")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"GAME_DIR={carpeta}\n")

          print(f"Proyecto localizado en: {carpeta}")
          PY

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Instalar Godot 4.3 y plantillas
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true

      - name: Configurar firma debug y Android
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/descontrol-debug.keystore" \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          CONFIG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/godot"
          mkdir -p "$CONFIG_DIR"

          cat > "$CONFIG_DIR/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/descontrol-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          cp "$CONFIG_DIR/editor_settings-4.3.tres" \
             "$CONFIG_DIR/editor_settings-4.tres"

      - name: Importar y comprobar el proyecto
        run: |
          godot --headless --path "$GAME_DIR" --editor --import \
            2>&1 | tee "$RUNNER_TEMP/godot-import.log"

          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$RUNNER_TEMP/godot-import.log"; then
            echo "::error::Godot encontro errores. Revisa las lineas anteriores."
            exit 1
          fi

      - name: Aplicar configuracion Android desde Godot
        run: |
          export DZ_TEMPLATE_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates/4.3.stable"

          cat > "$RUNNER_TEMP/configurar_android.gd" <<'GD'
          @tool
          extends SceneTree

          func _initialize() -> void:
              call_deferred("_configurar")

          func _configurar() -> void:
              var settings: EditorSettings = EditorInterface.get_editor_settings()
              if settings == null:
                  push_error("No se pudo acceder a los ajustes del editor.")
                  quit(1)
                  return

              var sdk: String = OS.get_environment("ANDROID_HOME")
              var java: String = OS.get_environment("JAVA_HOME")
              var key: String = OS.get_environment("RUNNER_TEMP").path_join("descontrol-debug.keystore")
              var templates: String = OS.get_environment("DZ_TEMPLATE_DIR")

              for archivo in [
                  key,
                  templates.path_join("android_debug.apk"),
                  templates.path_join("android_release.apk")
              ]:
                  if not FileAccess.file_exists(archivo):
                      push_error("Falta el archivo: " + archivo)
                      quit(1)
                      return

              print("SDK que tenia configurado Godot: ", settings.get_setting("export/android/android_sdk_path"))
              print("Java que tenia configurado Godot: ", settings.get_setting("export/android/java_sdk_path"))

              settings.set_setting("export/android/android_sdk_path", sdk)
              settings.set_setting("export/android/java_sdk_path", java)
              settings.set_setting("export/android/debug_keystore", key)
              settings.set_setting("export/android/debug_keystore_user", "androiddebugkey")
              settings.set_setting("export/android/debug_keystore_pass", "android")

              # Guardar en el archivo de ajustes que utiliza este editor.
              var settings_path: String = settings.resource_path
              if settings_path.is_empty():
                  settings_path = EditorInterface.get_editor_paths().get_config_dir().path_join("editor_settings-4.3.tres")

              if ResourceSaver.save(settings, settings_path) != OK:
                  push_error("No se pudieron guardar los ajustes: " + settings_path)
                  quit(1)
                  return

              # Usar rutas explicitas tambien en el preset.
              var preset: ConfigFile = ConfigFile.new()
              if preset.load("res://export_presets.cfg") != OK:
                  push_error("No se pudo abrir export_presets.cfg.")
                  quit(1)
                  return

              var opciones: String = ""
              for seccion in preset.get_sections():
                  if preset.get_value(seccion, "name", "") == "Android":
                      if preset.get_value(seccion, "platform", "") == "Android":
                          opciones = seccion + ".options"
                          break

              if opciones.is_empty():
                  push_error("No existe un preset Android llamado Android.")
                  quit(1)
                  return

              preset.set_value(opciones, "gradle_build/use_gradle_build", false)
              preset.set_value(opciones, "gradle_build/export_format", 0)
              preset.set_value(opciones, "custom_template/debug", templates.path_join("android_debug.apk"))
              preset.set_value(opciones, "custom_template/release", templates.path_join("android_release.apk"))
              preset.set_value(opciones, "keystore/debug", key)
              preset.set_value(opciones, "keystore/debug_user", "androiddebugkey")
              preset.set_value(opciones, "keystore/debug_password", "android")
              preset.set_value(opciones, "package/signed", true)

              if preset.save("res://export_presets.cfg") != OK:
                  push_error("No se pudo guardar el preset de exportacion.")
                  quit(1)
                  return

              print("=== CONFIGURACION GUARDADA ===")
              print("Archivo de ajustes: ", settings_path)
              print("Android SDK: ", sdk)
              print("Java SDK: ", java)
              print("Plantillas: ", templates)
              print("Firma debug: ", key)
              quit(0)
          GD

          godot --headless --editor \
            --path "$GAME_DIR" \
            --script "$RUNNER_TEMP/configurar_android.gd" \
            2>&1 | tee "$RUNNER_TEMP/android-config.log"

                   # Comprobar que el script termino de guardar los ajustes.
          if ! grep -Fq "=== CONFIGURACION GUARDADA ===" "$RUNNER_TEMP/android-config.log"; then
            echo "::error::No se confirmo el guardado de la configuracion."
            exit 1
          fi

          # Mantener la deteccion de errores, excepto los mensajes
          # conocidos de recursos RID al cerrar este proceso del editor.
          if grep -E 'SCRIPT ERROR:|^ERROR:' "$RUNNER_TEMP/android-config.log" \
            | grep -Ev '^ERROR: [0-9]+ RID allocations of type.*were leaked at exit[.]?$'; then
            echo "::error::Se encontro otro error durante la configuracion."
            exit 1
          fi
          
      - name: Exportar APK debug
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"

          echo "=== RUTAS ==="
          echo "Proyecto: $GAME_DIR"
          echo "Java: $JAVA_HOME"
          echo "Android SDK: $ANDROID_HOME"

          echo "=== AJUSTES DEL PRESET ==="
          grep -E '^(name|platform|gradle_build/use_gradle_build|architectures/arm64-v8a|package/unique_name)=' \
            "$GAME_DIR/export_presets.cfg" || true

          echo "=== PLANTILLAS EN LA RUTA HABITUAL ==="
          find "${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates" \
            -type f -name 'android_*.apk' -print 2>/dev/null || true

          echo "=== BUILD TOOLS INSTALADAS ==="
          ls "$ANDROID_HOME/build-tools" || true

          echo "=== FIRMA DEBUG ==="
          if [ -f "$RUNNER_TEMP/descontrol-debug.keystore" ]; then
            echo "Archivo de firma encontrado"
          else
            echo "Archivo de firma NO encontrado en la ruta prevista"
          fi

          echo "=== EXPORTACION CON REGISTRO DETALLADO ==="
          godot --headless --verbose \
            --path "$GAME_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/DescontrolZombies-debug.apk"

          test -s "$GITHUB_WORKSPACE/build/DescontrolZombies-debug.apk"
