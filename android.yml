name: Generar APK Debug (DescontrolZombies)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Godot 4.3 (with templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true

      - name: Import project (headless)
        shell: bash
        run: |
          cd DescontrolZombies
          godot --headless --editor --quit-after 10

      - name: Export Debug APK
        shell: bash
        run: |
          mkdir -p build
          cd DescontrolZombies
          godot --headless --verbose --export-debug "Android" ../build/DescontrolZombies-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DescontrolZombies-debug-apk
          path: build/DescontrolZombies-debug.apk
          if-no-files-found: error
